frame_id: map              # zones are drawn on the map
timezone: Africa/Lagos     # schedules below use this local time
alert_cooldown_s: 60       # same person re-entering the same zone within this time: no new alert log

zones:
  - name: east_room
    level: restricted      # no schedule: restricted 24/7
    polygon: [[1.55, -2.95], [3.95, -2.95], [3.95, 2.95], [1.55, 2.95]]

  - name: north_office
    level: restricted
    inactive_level: watch  # outside the schedule it is only watched, no alerts
    schedule:              # restricted after hours on weekdays, all day at weekends
      - days: [mon, tue, wed, thu, fri]
        start: "18:00"
        end: "07:00"
      - days: [sat, sun]
        start: "00:00"
        end: "23:59"
    polygon: [[-3.95, 1.05], [1.45, 1.05], [1.45, 2.95], [-3.95, 2.95]]

  - name: main_hall_west
    level: watch
    polygon: [[-3.95, -2.95], [-1.5, -2.95], [-1.5, 0.95], [-3.95, 0.95]]
