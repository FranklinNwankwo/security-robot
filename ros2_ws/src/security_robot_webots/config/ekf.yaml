ekf_filter_node:
  ros__parameters:
    frequency: 50.0               # faster than the ~33 Hz sensors, so the filter never falls behind
    sensor_timeout: 0.5
    two_d_mode: true              # ground robot: ignore z, roll, pitch
    publish_tf: true              # the EKF owns odom -> base_link
    predict_to_current_time: true # project each output to "now"

    # Re-apply late measurements instead of dropping them (messages arrive late when the laptop is busy)
    smooth_lagged_data: true
    history_length: 1.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Each sensor does the job it is best at:
    #             x      y      z      roll   pitch  yaw    vx     vy     vz     vroll  vpitch vyaw   ax     ay     az
    # Wheels: forward + sideways speed (sideways ~0 for a differential drive). NOT turning (wheels slip in turns).
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false, true,  true,  false, false, false, false, false, false, false]

    # Gyro: turning rate only. Absolute heading and acceleration are not used.
    imu0: /imu
    imu0_config:  [false, false, false, false, false, false, false, false, false, false, false, true,  false, false, false]
